availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/explicabilidad-api-key/versions/latest
      env: API_KEY_SECRET
steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    secretEnv: ["API_KEY_SECRET"]
    entrypoint: bash
    args:
      - -c
      - >-
        docker build --no-cache
        -t us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/explicabilidad-frontend:$BUILD_ID
        --build-arg NEXT_PUBLIC_API_URL=$_API_URL
        --build-arg NEXT_PUBLIC_API_KEY="$$API_KEY_SECRET"
        -f front_profile_xai/Dockerfile front_profile_xai
  - id: Push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/explicabilidad-frontend:$BUILD_ID
  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - explicabilidad-frontend
      - --platform=managed
      - --image=us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/explicabilidad-frontend:$BUILD_ID
      - --region=us-central1
      - --min-instances=0
      - --quiet
images:
  - us-central1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/explicabilidad-frontend:$BUILD_ID
substitutions:
  _API_URL: ""
options:
  logging: CLOUD_LOGGING_ONLY
